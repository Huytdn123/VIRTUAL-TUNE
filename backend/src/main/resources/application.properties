# =========================================================================
# VIRTUAL TUNE - Unified Spring Boot Configuration
# =========================================================================

# Dynamic port: Render assigns PORT, fallback to 10000 locally
server.port=${PORT:10000}

# In-Memory H2 Database with MSSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:VirtualTuneDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Java 25 Virtual Threads
spring.threads.virtual.enabled=true

# Multipart File Upload (3D models GLTF/GLB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#---
# =========================================================================
# Development / Local Profile (active when prod is not set)
# =========================================================================
spring.config.activate.on-profile=!prod

# Enable H2 Web Console for local testing & debugging
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Allow local Vite dev servers
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

#---
# =========================================================================
# Production Profile (prod - Render Cloud Deployment)
# =========================================================================
spring.config.activate.on-profile=prod

# Disable H2 Web Console in production
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Production CORS: Allow Vercel domains
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

# Embedded Tomcat Tuning (Render 512MB RAM / 0.15 vCPU)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.connection-timeout=20000
server.tomcat.accept-count=50

# HikariCP Connection Pool Tuning (Minimal memory overhead on H2 in-memory)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
